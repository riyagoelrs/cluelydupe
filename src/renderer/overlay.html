<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; font-src 'self'" />
<title>cluely</title>
<link rel="stylesheet" href="./overlay.css" />
<body>
  <div class="shell">
    <header class="bar">
      <div class="brand">
        <span id="rec" class="rec" data-state="idle"></span>
        <span class="name">cluely</span>
      </div>
      <div class="chips">
        <span class="chip" id="chip-mic" title="Microphone">ME</span>
        <span class="chip" id="chip-sys" title="System audio">THEM</span>
        <span class="chip" id="chip-docs" title="Indexed materials">DOCS</span>
      </div>
      <div class="actions">
        <button id="btn-listen" class="btn primary" title="⌘/Ctrl+Shift+L">Listen</button>
        <button id="btn-auto" class="btn" title="Answer questions automatically">Auto</button>
        <button id="btn-screen" class="btn" title="Answer using what's on screen (⌘/Ctrl+Shift+S)">Screen</button>
        <button id="btn-ghost" class="btn" title="Let clicks pass through the overlay">Ghost</button>
        <button id="btn-context" class="btn" title="Edit the notes sent with every answer">Notes</button>
        <button id="btn-materials" class="btn" title="Open your materials folder — click DOCS to re-index">Docs</button>
        <button id="btn-clear" class="btn" title="⌘/Ctrl+Shift+K">Clear</button>
        <button id="btn-pin" class="btn" title="Float above everything, or sit behind other windows (⌘/Ctrl+Shift+P)">Pin</button>
        <button id="btn-hide" class="btn icon" title="Hide — bring it back with ⌘/Ctrl+Shift+H">—</button>
        <button id="btn-quit" class="btn icon danger" title="Quit (⌘/Ctrl+Shift+Q)">✕</button>
      </div>
    </header>

    <div id="notice" class="notice" hidden></div>

    <main id="answers" class="answers">
      <div class="empty" id="empty">
        <p class="empty-title">Nothing yet</p>
        <p class="empty-body">
          Hit <b>Listen</b>, then let them talk. Questions get answered here on their own.<br />
          <b>⌘/Ctrl+Shift+Space</b> answers on demand · <b>⌘/Ctrl+Shift+S</b> reads your screen<br />
          <b>⌘/Ctrl+Shift+H</b> hides this · <b>⌘/Ctrl+Shift+Q</b> quits.
        </p>
      </div>
    </main>

    <footer class="live">
      <div id="transcript" class="transcript"></div>
    </footer>
    <div id="grip" class="grip" title="Drag to resize"></div>
  </div>
  <script type="module" src="./overlay.js"></script>
</body>
