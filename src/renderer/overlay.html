<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; font-src 'self'" />
<title>cluely</title>
<link rel="stylesheet" href="./overlay.css" />
<body>
  <div class="shell">
    <header class="bar">
      <div class="drag-surface" title="Drag to move">
        <span id="rec" class="rec" data-state="idle"></span>
        <span class="name">cluely</span>
        <span class="chip" id="chip-mic" title="Microphone">ME</span>
        <span class="chip" id="chip-sys" title="Call audio">THEM</span>
        <span class="chip docs-chip" id="chip-docs" title="Prep materials">DOCS</span>
      </div>
      <div class="primary-actions">
        <button id="btn-listen" class="btn listen" title="⌘/Ctrl+Shift+L">Listen</button>
        <button id="btn-more" class="btn icon" title="More controls">•••</button>
        <button id="btn-hide" class="btn icon" title="Minimize">—</button>
        <button id="btn-quit" class="btn icon danger" title="Quit — ⌘/Ctrl+Shift+Q">✕</button>
      </div>
    </header>

    <div id="more-menu" class="more-menu" hidden>
      <button id="btn-auto" class="btn" title="Answer questions automatically">Auto</button>
      <button id="btn-context" class="btn" title="Edit always-on context">Notes</button>
      <button id="btn-materials" class="btn" title="Add prep files">Files</button>
      <button id="btn-setup" class="btn" title="Audio/model setup">Setup</button>
      <button id="btn-screen" class="btn" title="Answer using the screen — ⌘/Ctrl+Shift+S">Screen</button>
      <button id="btn-ghost" class="btn" title="Click-through — ⌘/Ctrl+Shift+G">Ghost</button>
      <button id="btn-pin" class="btn" title="Float above other windows — ⌘/Ctrl+Shift+P">Pin</button>
      <button id="btn-clear" class="btn" title="Clear answers — ⌘/Ctrl+Shift+K">Clear</button>
    </div>

    <button id="notice" class="notice" hidden></button>

    <section id="panel" class="panel" hidden>
      <div class="panel-head">
        <div>
          <div id="panel-title" class="panel-title"></div>
          <div id="panel-subtitle" class="panel-subtitle"></div>
        </div>
        <button id="panel-close" class="btn icon" title="Close">✕</button>
      </div>

      <div id="panel-notes" class="panel-view" hidden>
        <textarea id="context-editor" class="editor" spellcheck="true" placeholder="Resume facts, deal details, stories, numbers, or anything that should shape every answer..."></textarea>
        <div class="panel-footer">
          <span id="context-feedback" class="feedback"></span>
          <button id="context-save" class="btn primary-action">Save notes</button>
        </div>
      </div>

      <div id="panel-materials" class="panel-view" hidden>
        <div class="panel-toolbar">
          <button id="materials-add" class="btn primary-action">Add files…</button>
          <button id="materials-refresh" class="btn">Re-index</button>
          <button id="materials-reveal" class="btn">Show folder</button>
        </div>
        <div id="materials-feedback" class="feedback block"></div>
        <div class="file-help">Prep files are indexed locally and retrieved only when relevant to the question.</div>
        <div id="materials-list" class="file-list"></div>
      </div>

      <div id="panel-setup" class="panel-view" hidden>
        <div class="setup-list">
          <div class="setup-row">
            <span id="setup-cli-dot" class="setup-dot"></span>
            <div class="setup-copy"><b>Whisper engine</b><span id="setup-cli-text"></span></div>
          </div>
          <div class="setup-row">
            <span id="setup-model-dot" class="setup-dot"></span>
            <div class="setup-copy"><b>Whisper model</b><span id="setup-model-text"></span></div>
            <div class="setup-actions">
              <button id="setup-choose-model" class="btn">Choose…</button>
              <button id="setup-download-model" class="btn primary-action">Download base.en</button>
            </div>
          </div>
          <div class="setup-row">
            <span id="setup-screen-dot" class="setup-dot"></span>
            <div class="setup-copy"><b>Call audio</b><span id="setup-screen-text"></span></div>
            <button id="setup-screen-settings" class="btn">Open Settings</button>
          </div>
          <div class="setup-row">
            <span id="setup-mic-dot" class="setup-dot"></span>
            <div class="setup-copy"><b>Microphone</b><span id="setup-mic-text"></span></div>
            <button id="setup-mic-settings" class="btn">Open Settings</button>
          </div>
          <div class="setup-row">
            <span id="setup-ollama-dot" class="setup-dot"></span>
            <div class="setup-copy"><b>Ollama</b><span id="setup-ollama-text"></span></div>
          </div>
          <div class="setup-row">
            <span id="setup-models-dot" class="setup-dot"></span>
            <div class="setup-copy"><b>Answer models</b><span id="setup-models-text"></span></div>
          </div>
        </div>
        <div id="setup-feedback" class="feedback block"></div>
        <div class="setup-footer">
          <button id="setup-refresh" class="btn">Refresh checks</button>
          <button id="setup-reset-window" class="btn">Reset window</button>
        </div>
      </div>
    </section>

    <main id="answers" class="answers" hidden></main>

    <!-- Transcript is kept in memory for context and debugging, but hidden from
         the normal UI so the assistant only shows what the user needs to say. -->
    <footer class="live" hidden>
      <div id="transcript" class="transcript"></div>
    </footer>

    <div id="grip-right" class="grip-edge grip-right" title="Drag to resize"></div>
    <div id="grip-bottom" class="grip-edge grip-bottom" title="Drag to resize"></div>
    <div id="grip-corner" class="grip-edge grip-corner" title="Drag to resize"></div>
  </div>
  <script type="module" src="./overlay.js"></script>
  <script type="module" src="./panels.js"></script>
</body>
